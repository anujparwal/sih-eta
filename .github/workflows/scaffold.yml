name: Phase 1 scaffold

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaffold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
      - name: Start four healthy services on Docker Engine
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 180
          curl --fail http://localhost:8000/ready
          curl --fail --output /dev/null http://localhost:3000/
      - name: Check backend inside its container
        run: |
          docker compose run --rm -T backend pytest
          docker compose run --rm -T backend ruff check .
          docker compose run --rm -T backend ruff format --check .
      - name: Capture service status and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
      - name: Stop services
        if: always()
        run: docker compose down
